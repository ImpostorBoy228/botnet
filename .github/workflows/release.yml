name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: build master (linux)
        run: cargo build --release --bin master

      - uses: actions/upload-artifact@v4
        with:
          name: master-linux
          path: target/release/master

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: build slave + virus (windows)
        run: cargo build --release

      - uses: actions/upload-artifact@v4
        with:
          name: slave-windows
          path: |
            target/release/slave.exe
            target/release/virus.exe

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            master
            slave.exe
            virus.exe
          generate_release_notes: true
